iris.features.required = COMPUTE_SHADERS CUSTOM_IMAGES SSBO

bufferObject.0 = 4

# Bloom upsample passes accumulate into the finer level inside the shader
# (compute read-modify-write of their own texel), so no blending is needed.

blend.gbuffers_basic.gbuffers = off
blend.gbuffers_terrain.gbuffers = off
blend.gbuffers_entities.gbuffers = off
blend.gbuffers_hand.gbuffers = off

particles.ordering = mixed

customTexture.starDirectionTex = textures/star_direction.dat TEXTURE_2D RGBA16F 512 512 RGBA HALF_FLOAT
customTexture.starColorTex = textures/star_color.dat TEXTURE_2D RGBA8 512 512 RGBA UNSIGNED_BYTE
customTexture.nightSkyTex = textures/nightsky.png

texture.noise = textures/noise.png

sliders = VIGNETTE_AMOUNT BLOOM_THRESHOLD BLOOM_THRESHOLD_SMOOTH BLOOM_SPREAD BLOOM_STRENGTH

separateAo = true

sky = false
moon = false
sun = false
stars = true
clouds = false
underwaterOverlay = false

#occlusion.culling = true
shadow.culling = true

program.gbuffers_skybasic.enabled = true
program.gbuffers_skytextured.enabled = false
program.gbuffers_clouds.enabled = false
program.gbuffers_weather.enabled = false

uniform.vec3.sunDirection = vec3(gbufferModelViewInverse.0.0 * sunPosition.x * 0.01 + gbufferModelViewInverse.1.0 * sunPosition.y * 0.01 + gbufferModelViewInverse.2.0 * sunPosition.z * 0.01, gbufferModelViewInverse.0.1 * sunPosition.x * 0.01 + gbufferModelViewInverse.1.1 * sunPosition.y * 0.01 + gbufferModelViewInverse.2.1 * sunPosition.z * 0.01, gbufferModelViewInverse.0.2 * sunPosition.x * 0.01 + gbufferModelViewInverse.1.2 * sunPosition.y * 0.01 + gbufferModelViewInverse.2.2 * sunPosition.z * 0.01 )
uniform.vec3.moonDirection = vec3(gbufferModelViewInverse.0.0 * moonPosition.x * 0.01 + gbufferModelViewInverse.1.0 * moonPosition.y * 0.01 + gbufferModelViewInverse.2.0 * moonPosition.z * 0.01, gbufferModelViewInverse.0.1 * moonPosition.x * 0.01 + gbufferModelViewInverse.1.1 * moonPosition.y * 0.01 + gbufferModelViewInverse.2.1 * moonPosition.z * 0.01, gbufferModelViewInverse.0.2 * moonPosition.x * 0.01 + gbufferModelViewInverse.1.2 * moonPosition.y * 0.01 + gbufferModelViewInverse.2.2 * moonPosition.z * 0.01 )
uniform.vec3.shadowDirection = vec3(gbufferModelViewInverse.0.0 * shadowLightPosition.x * 0.01 + gbufferModelViewInverse.1.0 * shadowLightPosition.y * 0.01 + gbufferModelViewInverse.2.0 * shadowLightPosition.z * 0.01, gbufferModelViewInverse.0.1 * shadowLightPosition.x * 0.01 + gbufferModelViewInverse.1.1 * shadowLightPosition.y * 0.01 + gbufferModelViewInverse.2.1 * shadowLightPosition.z * 0.01, gbufferModelViewInverse.0.2 * shadowLightPosition.x * 0.01 + gbufferModelViewInverse.1.2 * shadowLightPosition.y * 0.01 + gbufferModelViewInverse.2.2 * shadowLightPosition.z * 0.01 )

